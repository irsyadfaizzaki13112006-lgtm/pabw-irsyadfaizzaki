<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal dan Target Olahraga Saya</title>
  
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="layout.css" />
  <link rel="stylesheet" href="komponen.css" />
  <link rel="stylesheet" href="tema.css" />
  <link rel="stylesheet" href="responsif.css" />
</head>
<body>

  <header class="header-utama">
    <button id="tombol-tema" class="tombol-tema">🌙 Pengalih Tema</button>
  </header>

  <main class="kontainer-utama">
    <section class="banner-profil">
      <div class="teks-banner">
        <h1>Jadwal & Target Olahraga</h1>
        <nav class="nav-sub">
          <a href="#daftar">Jadwal</a>
          <a href="#rencana">Catat Latihan</a>
        </nav>
      </div>
      <div class="pembungkus-foto">
        <img src="aktivitas-olahraga.jpeg" alt="Persiapan sebelum latihan" class="foto-latihan" />
        <p class="caption-foto">Persiapan sebelum memulai latihan.</p>
      </div>
    </section>

    <section class="bagian-jadwal">
      <h2>Jadwal Olahraga</h2>
      <div id="daftar" class="grid-kartu"></div>
    </section>

    <section id="rencana" class="bagian-rencana">
      <h3>Rencana Latihan Mingguan</h3>
      <table class="tabel-rencana">
        <thead>
          <tr>
            <th>Hari</th>
            <th>Jenis Olahraga</th>
            <th>Durasi</th>
            <th>Target Kalori</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Senin</td>
            <td>Lari Pagi</td>
            <td>30 menit</td>
            <td>300 kcal</td>
          </tr>
          <tr>
            <td>Rabu</td>
            <td>Renang</td>
            <td>45 menit</td>
            <td>400 kcal</td>
          </tr>
          <tr>
            <td>Jumat</td>
            <td>Latihan Beban</td>
            <td>60 menit</td>
            <td>350 kcal</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
